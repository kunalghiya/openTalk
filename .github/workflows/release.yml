name: Release

# Trigger: push a tag like v0.1.0 → builds DMG and uploads to GitHub Releases.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Opt into Node.js 24 for JavaScript-based actions ahead of the June 2026
  # forced migration. https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    # macos-26 ships with Xcode 26 — required to read project format 77 that
    # current XcodeGen (2.45+) generates.
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show available Xcodes
        run: |
          ls /Applications | grep -i Xcode || true
          xcodebuild -version

      - name: Select latest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then
            sudo xcode-select -s "$LATEST"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # If repo secrets are set, decrypt the Developer ID certificate into a
      # temporary keychain. If not, the script falls back to ad-hoc signing —
      # users will hit Gatekeeper but the build still succeeds and uploads.
      - name: Import Developer ID certificate
        if: ${{ secrets.DEVELOPER_ID_P12 != '' }}
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
                          -k "$KEYCHAIN_PATH" \
                          -P "$DEVELOPER_ID_P12_PASSWORD" \
                          -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
                                          -s -k "$KEYCHAIN_PASSWORD" \
                                          "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Write Local.xcconfig
        run: |
          echo "DEVELOPMENT_TEAM = ${{ secrets.APPLE_TEAM_ID }}" > Local.xcconfig

      - name: Build DMG
        env:
          DEVELOPER_ID_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./Scripts/build-release.sh

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/*.dmg
          generate_release_notes: true
