name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Opt into Node.js 24 for JavaScript-based actions ahead of the June 2026
  # forced migration. https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    # macos-26 ships with Xcode 26, which is what current XcodeGen (2.45+)
    # targets. Older runners (macos-14 / Xcode 15.x) fail with "future Xcode
    # project file format (77)" because XcodeGen no longer supports the older
    # objectVersion via project.yml.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show available Xcodes
        run: |
          ls /Applications | grep -i Xcode || true
          xcodebuild -version

      - name: Select latest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then
            sudo xcode-select -s "$LATEST"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # CI doesn't need a real signing identity for the test bundle — ad-hoc
      # is fine. We just need to satisfy XcodeGen's xcconfig reference.
      - name: Stub Local.xcconfig
        run: 'echo "DEVELOPMENT_TEAM =" > Local.xcconfig'

      - name: Generate project
        run: xcodegen generate

      - name: Build & test
        run: |
          xcodebuild test \
            -project openTalk.xcodeproj \
            -scheme openTalk \
            -destination 'platform=macOS' \
            -allowProvisioningUpdates \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
