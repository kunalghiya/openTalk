name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Opt into Node.js 24 for JavaScript-based actions ahead of the June 2026
  # forced migration. https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      # CI doesn't need a real signing identity for the test bundle — ad-hoc
      # is fine. We just need to satisfy XcodeGen's xcconfig reference.
      - name: Stub Local.xcconfig
        run: 'echo "DEVELOPMENT_TEAM =" > Local.xcconfig'

      - name: Generate project
        run: xcodegen generate

      - name: Build & test
        run: |
          xcodebuild test \
            -project openTalk.xcodeproj \
            -scheme openTalk \
            -destination 'platform=macOS' \
            -allowProvisioningUpdates \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
